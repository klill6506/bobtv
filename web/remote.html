<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BobTV Remote</title>
<link rel="stylesheet" href="/remote.css">
<script src="/remote.js" defer></script>
</head>
<body><main>
<header><span>BOBTV</span><h1>Your TV. Your buttons.</h1><p>Keep your iPhone on the same Wi-Fi as BobTV.</p></header>
<p id="status" role="status" aria-live="polite">Connecting…</p>
<section aria-label="TV controls" class="controls">
<button data-action="home">⌂ Home</button>
<button data-action="play-pause">▶ / Ⅱ Play / Pause</button>
<button data-action="volume-down">− Volume</button>
<button data-action="volume-up">+ Volume</button>
<button data-action="mute" class="wide">Mute / Unmute</button>
</section>
<h2>Watch something</h2><div id="channels" class="channels"></div>
<footer>Play / Pause controls the active media player.<br>To keep this remote: Safari → Share → Add to Home Screen.</footer>
</main></body></html>
